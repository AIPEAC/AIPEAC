# ---------------------------------------------------------------
# Workflow: Update Top Languages Bar
# ---------------------------------------------------------------
# Aggregates language byte counts from the AIPEAC user account and
# the AIPEACM / AIPEACMS / AIPEACS organizations (forks excluded),
# then commits the segmented bar SVG and the README legend.
#
# Schedule: Weekly (Monday 03:00 UTC) and on manual dispatch.
# Output:   assets/top-langs-bar.svg + README.md legend section.
# ---------------------------------------------------------------

name: Update Top Languages

on:
  schedule:
    - cron: "0 3 * * 1" # Weekly: Monday 03:00 UTC
  workflow_dispatch:     # Allow manual trigger from Actions tab

permissions:
  contents: write

jobs:
  update-top-langs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate top languages bar
        run: python3 scripts/top_langs.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/top-langs-bar.svg README.md
          git diff --staged --quiet || (git commit -m "chore: update top languages bar" && git push)